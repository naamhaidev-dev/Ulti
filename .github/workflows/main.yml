name: 🚀 Hyper Telegram Bot 24/7

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_restart:
        description: "Force full restart"
        required: false
        default: false
        type: boolean

env:
  BOT_SCRIPT: "ultimatecs.py"
  PYTHON_VERSION: "3.11"
  MAX_RETRIES: 3

jobs:
  # ─── JOB 1: Dependencies ───
  deps:
    name: "📦 Install Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: "Install requirements"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found"
          
      - name: "Save dependency cache"
        uses: actions/upload-artifact@v4
        with:
          name: deps-cache
          path: |
            ~/.cache/pip
          retention-days: 1

  # ─── JOB 2: Bot Runner ───
  run-bot:
    name: "🤖 Run Bot"
    needs: [deps]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      PYTHONUNBUFFERED: "1"
      
    steps:
      - uses: actions/checkout@v4
      
      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: "Restore deps"
        uses: actions/download-artifact@v4
        with:
          name: deps-cache
          path: ~/.cache/pip
      
      - name: "Install dependencies"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt"
      
      - name: "🚀 Launch Bot with Retry"
        id: launch
        run: |
          set +e
          MAX=${{ env.MAX_RETRIES }}
          ATTEMPT=1
          EXIT_CODE=1
          
          while [ $ATTEMPT -le $MAX ]; do
            echo "🔄 Attempt $ATTEMPT / $MAX"
            python ${{ env.BOT_SCRIPT }}
            EXIT_CODE=$?
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Bot exited cleanly"
              break
            fi
            
            echo "❌ Crash detected (code: $EXIT_CODE)"
            ATTEMPT=$((ATTEMPT + 1))
            
            if [ $ATTEMPT -le $MAX ]; then
              WAIT=$((30 * ATTEMPT))
              echo "⏳ Waiting ${WAIT}s before retry..."
              sleep $WAIT
            fi
          done
          
          exit $EXIT_CODE
      
      - name: "💓 Heartbeat ping"
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [ -n "$HEARTBEAT_URL" ]; then
            curl -fsS -m 10 "$HEARTBEAT_URL" || echo "Heartbeat failed"
          fi
      
      - name: "📤 Upload logs on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-crash-logs
          path: |
            *.log
          retention-days: 3

  # ─── JOB 3: Cleanup ───
  cleanup:
    name: "🧹 Cleanup"
    needs: [run-bot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Delete old artifacts"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🧹 Cleaning old artifacts..."                  

        
